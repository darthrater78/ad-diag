name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build AdDiag.csproj -c Release -warnaserror

      - name: Test
        run: dotnet test tests/AdDiag.Tests -c Release -warnaserror

      - name: Publish (single-file smoke test)
        run: dotnet publish AdDiag.csproj -c Release -r win-x64 -o publish

      # The exe itself (not zipped), for testing a branch on a domain-joined machine before release
      - name: Upload exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: publish/ad-diag.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
