name: CI

# Every branch push builds, so a branch can be tested (and its exe downloaded) before any pull request exists.
# pull_request is kept for forks only, whose pushes don't run here; same-repo PRs are covered by the push run.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A docs-only change (Markdown, docs/, screenshots) has nothing to build or test
  changes:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-changes.sh "$BASE" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Runs unless the change is known to be docs-only; if the changes job itself fails, build anyway
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build AdDiag.csproj -c Release -warnaserror

      - name: Test
        run: dotnet test tests/AdDiag.Tests -c Release -warnaserror

      # The screenshot harness compiles the app's own MainForm; it only runs on Linux, but it must keep building
      - name: Build screenshot harness
        run: dotnet build tools/screenshots/Shots.csproj -c Release -warnaserror

      - name: Publish (single-file smoke test)
        run: dotnet publish AdDiag.csproj -c Release -r win-x64 -o publish

      # The exe itself (not zipped), for testing a branch on a domain-joined machine before release
      - name: Upload exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: publish/ad-diag.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
