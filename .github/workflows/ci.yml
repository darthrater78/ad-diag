name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build AdDiag.csproj -c Release -warnaserror

      - name: Test
        run: dotnet test tests/AdDiag.Tests -c Release -warnaserror

      - name: Publish (single-file smoke test)
        run: dotnet publish AdDiag.csproj -c Release -r win-x64 -o publish
