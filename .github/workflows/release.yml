name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Derive version from tag
        shell: pwsh
        run: |
          if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$') {
            throw "Tag '$env:REF_NAME' is not of the form vMAJOR.MINOR.PATCH[-prerelease]"
          }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          "ASSET=ad-diag-$env:REF_NAME-win-x64.exe" >> $env:GITHUB_ENV

      - name: Publish win-x64 self-contained build
        run: dotnet publish AdDiag.csproj -c Release -r win-x64 -o publish -p:Version=${{ env.VERSION }}

      - name: Rename build output and write checksum
        shell: pwsh
        run: |
          Copy-Item publish\ad-diag.exe $env:ASSET
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLowerInvariant()
          "$hash  $env:ASSET" | Out-File -Encoding ascii "$env:ASSET.sha256"
          Get-Content "$env:ASSET.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
